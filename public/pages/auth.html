<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Authentication</title>
<link rel="stylesheet" href="/assets/style.css"></head><body>
<main><h1 data-testid="page-title">Authentication</h1><p class="sub">Session, storage state and protected data. This page is only reachable when logged in; use Logout in the top bar to end the session.</p>
<section class="card"><h2 data-testid="welcome">Welcome</h2>
<p>Role: <span id="role" data-testid="role"></span></p>
<p>Token in localStorage: <code data-testid="token-present"></code></p>
<a class="btn" href="/pages/dashboard.html" data-testid="go-dashboard">Go to protected dashboard</a>
<button id="fetch-secure" class="secondary" data-testid="fetch-secure">Fetch secure data</button>
<div class="result" id="secure-result" data-testid="secure-result"></div></section>
<script>
const $ = id => document.getElementById(id);
(async () => {
  const r = await fetch('/api/me');
  if (!r.ok) { location.replace('/login.html?redirect=' + encodeURIComponent(location.pathname)); return; }
  const u = await r.json();
  document.querySelector('[data-testid=welcome]').textContent = `Welcome, ${u.username}`;
  $('role').textContent = u.role;
  document.querySelector('[data-testid=token-present]').textContent = localStorage.getItem('authToken') ? 'yes' : 'no';
})();
$('fetch-secure').onclick = async () => { const r = await fetch('/api/secure-data'); $('secure-result').textContent = r.ok ? (await r.json()).secret : 'Unauthorized (' + r.status + ')'; };
</script>
</main><script src="/assets/nav.js"></script>
