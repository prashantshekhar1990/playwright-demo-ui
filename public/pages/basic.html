<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Basic Elements</title>
<link rel="stylesheet" href="/assets/style.css"></head><body>
<main><h1 data-testid="page-title">Basic Elements</h1><p class="sub">Input, button, checkbox, radio, dropdown</p>
<section class="card"><h2>Form</h2>
<form id="basic-form" data-testid="basic-form">
 <div><label for="fullname">Full name</label><input type="text" id="fullname" name="fullname" placeholder="Enter full name" data-testid="fullname"></div>
 <div><label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@example.com" data-testid="email"></div>
 <div><label for="pwd">Password</label><input type="password" id="pwd" data-testid="password"></div>
 <div><label for="age">Age</label><input type="number" id="age" min="0" max="120" data-testid="age"></div>
 <div><label for="bio">Bio</label><textarea id="bio" rows="2" data-testid="bio"></textarea></div>
 <div><label><input type="checkbox" id="newsletter" data-testid="chk-newsletter"> Subscribe to newsletter</label>
      <label><input type="checkbox" id="terms" data-testid="chk-terms" checked> Accept terms</label></div>
 <div role="radiogroup" aria-label="Gender">
   <label><input type="radio" name="gender" value="male" data-testid="radio-male"> Male</label>
   <label><input type="radio" name="gender" value="female" data-testid="radio-female"> Female</label>
   <label><input type="radio" name="gender" value="other" data-testid="radio-other"> Other</label></div>
 <div><label for="country">Country</label>
   <select id="country" data-testid="country"><option value="">-- Select --</option><option value="in">India</option><option value="us">United States</option><option value="uk">United Kingdom</option></select></div>
 <div><label for="disabled">Disabled input</label><input id="disabled" type="text" value="cannot edit" disabled data-testid="disabled-input">
      <label for="readonly">Read-only</label><input id="readonly" type="text" value="read only" readonly data-testid="readonly-input"></div>
 <button type="submit" data-testid="submit-btn">Submit</button>
 <button type="reset" class="secondary" data-testid="reset-btn">Reset</button>
</form>
<div class="result" id="basic-result" data-testid="basic-result">No submission yet</div></section>
<script>
document.getElementById('basic-form').addEventListener('submit', e => {
  e.preventDefault();
  const g = id => document.getElementById(id);
  const data = { name:g('fullname').value, email:g('email').value, age:g('age').value, bio:g('bio').value,
    newsletter:g('newsletter').checked, terms:g('terms').checked,
    gender:(document.querySelector('input[name=gender]:checked')||{}).value||null, country:g('country').value };
  g('basic-result').textContent = JSON.stringify(data, null, 2);
});
document.getElementById('basic-form').addEventListener('reset', () => setTimeout(()=>document.getElementById('basic-result').textContent='No submission yet'));
</script>
</main><script src="/assets/nav.js"></script>
