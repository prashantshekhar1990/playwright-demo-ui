<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Login</title>
<link rel="stylesheet" href="/assets/style.css"></head><body>
<main class="login-main"><h1 data-testid="login-title">Playwright Demo UI</h1>
<p class="sub">Sign in to continue. Valid: admin/admin123, user/user123, locked/any => 403</p>
<section class="card" id="login-card"><h2>Login</h2>
<form id="login-form" data-testid="login-form">
 <div><label for="username">Username</label><input type="text" id="username" name="username" data-testid="username"></div>
 <div><label for="password">Password</label><input type="password" id="password" name="password" data-testid="password"></div>
 <label><input type="checkbox" id="remember" data-testid="remember-me"> Remember me (localStorage)</label><br>
 <button type="submit" data-testid="login-btn">Login</button></form>
<div class="result err hidden" id="login-error" data-testid="login-error" role="alert"></div></section>
<script>
const $ = id => document.getElementById(id);
// Where to go after login: ?redirect=<same-site path>, otherwise the home page.
function target() {
  const r = new URLSearchParams(location.search).get('redirect');
  return r && r.startsWith('/') && !r.startsWith('//') && !r.includes('\\') && !r.startsWith('/login.html') ? r : '/index.html';
}
$('login-form').onsubmit = async e => {
  e.preventDefault(); $('login-error').classList.add('hidden');
  const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username:$('username').value, password:$('password').value }) });
  const j = await r.json();
  if (!r.ok) { $('login-error').textContent = j.error; $('login-error').classList.remove('hidden'); return; }
  localStorage.setItem('authToken', j.token); if ($('remember').checked) localStorage.setItem('rememberedUser', j.username); else localStorage.removeItem('rememberedUser');
  sessionStorage.setItem('loginTime', new Date().toISOString());
  location.replace(target());
};
if (localStorage.getItem('rememberedUser')) $('username').value = localStorage.getItem('rememberedUser');
</script>
</main></body></html>
